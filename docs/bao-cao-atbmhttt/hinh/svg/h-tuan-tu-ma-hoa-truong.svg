="stroke" stroke-linejoin="round"><tspan x="524.0" y="411.0">5. encrypt(CCCD, &quot;customers.national_id:{id}&quot;)</tspan></text><path d="M726.0,450 H760.0 V492 H730.0" fill="none" stroke="#1f2a30" stroke-width="1.4" marker-end="url(#head-1f2a30)"/><text font-family="Liberation Sans, Arial, DejaVu Sans, sans-serif" font-size="13" fill="#1f2a30" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round"><tspan x="768.0" y="462.9">6. nonce 96 bit ngẫu nhiên; AAD = 02 ‖ ngữ cảnh;</tspan><tspan x="768.0" y="479.1">ChaCha20 ⊕ bản rõ, Poly1305 → tag</tspan></text><line x1="726.0" y1="532" x2="518.0" y2="532" stroke="#1f2a30" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open-1f2a30)"/><text font-family="Liberation Sans, Arial, DejaVu Sans, sans-serif" font-size="13" fill="#1f2a30" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round"><tspan x="524.0" y="521.0">7. 02 ‖ nonce ‖ ciphertext ‖ tag</tspan></text><line x1="514.0" y1="592" x2="934.0" y2="592" stroke="#1f2a30" stroke-width="1.4" marker-end="url(#head-1f2a30)"/><text font-family="Liberation Sans, Arial, DejaVu Sans, sans-serif" font-size="13" fill="#1f2a30" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round"><tspan x="524.0" y="564.9">8. UPDATE customers (national_id_enc, national_id_hash);</tspan><tspan x="524.0" y="581.1">AuditService.log trong cùng giao dịch</tspan></text><rect x="22" y="140" width="1196" height="472" rx="2" fill="none" stroke="#5b6b73" stroke-width="1"/><path d="M22,140 h364.8 v18 l-8,8 H22 z" fill="#eef1f2" stroke="#5b6b73" stroke-width="1"/><text font-family="Liberation Sans, Arial, DejaVu Sans, sans-serif" font-size="12" fill="#5b6b73" font-weight="bold" font-style="normal" text-anchor="start" dominant-baseline="middle"><tspan x="28" y="153.0">Ghi: khách hàng khai thông tin tài chính (bước 2)</tspan></text><line x1="1150.0" y1="686" x2="306.0" y2="686" stroke="#1f2a30" stroke-width="1.4" marker-end="url(#head-1f2a30)"/><text font-family="Liberation Sans, Arial, DejaVu Sans, sans-serif" font-size="13" fill="#1f2a30" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round"><tspan x="312.0" y="675.0">9. Hiện CCCD (quyền CUSTOMER_VIEW_PII)</tspan></text><line x1="302.0" y1="730" x2="510.0" y2="730" stroke="#1f2a30" stroke-width="1.4" marker-end="url(#head-1f2a30)"/><text font-family="Liberation Sans, Arial, DejaVu Sans, sans-serif" font-size="13" fill="#1f2a30" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round"><tspan x="312.0" y="719.0">10. kiểm tra quyền, phân tách nhiệm vụ</tspan></text><line x1="514.0" y1="774" x2="934.0" y2="774" stroke="#1f2a30" stroke-width="1.4" marker-end="url(#head-1f2a30)"/><text font-family="Liberation Sans, Arial, DejaVu Sans, sans-serif" font-size="13" fill="#1f2a30" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round"><tspan x="524.0" y="763.0">11. SELECT national_id_enc</tspan></text><line x1="514.0" y1="818" x2="722.0" y2="818" stroke="#1f2a30" stroke-width="1.4" marker-end="url(#head-1f2a30)"/><text font-family="Liberation Sans, Arial, DejaVu Sans, sans-serif" font-size="13" fill="#1f2a30" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round"><tspan x="524.0" y="807.0">12. decrypt(blob, &quot;customers.national_id:{id}&quot;)</tspan></text><path d="M726.0,846 H760.0 V888 H730.0" fill="none" stroke="#1f2a30" stroke-width="1.4" marker-end="url(#head-1f2a30)"/><text font-family="Liberation Sans, Arial, DejaVu Sans, sans-serif" font-size="13" fill="#1f2a30" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round"><tspan x="768.0" y="858.9">13. tính lại tag, so sánh thời gian hằng;</tspan><tspan x="768.0" y="875.1">khớp mới giải mã</tspan></text><line x1="514.0" y1="928" x2="934.0" y2="928" stroke="#1f2a30" stroke-width="1.4" marker-end="url(#head-1f2a30)"/><text font-family="Liberation Sans, Arial, DejaVu Sans, sans-serif" font-size="13" fill="#1f2a30" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round"><tspan x="524.0" y="917.0">14. ghi VIEW_PII (quá 20 lượt/giờ → cảnh báo CRITICAL)</tspan></text><line x1="302.0" y1="972" x2="1146.0" y2="972" stroke="#1f2a30" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open-1f2a30)"/><text font-family="Liberation Sans, Arial, DejaVu Sans, sans-serif" font-size="13" fill="#1f2a30" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round"><tspan x="312.0" y="961.0">15. CCCD đầy đủ (Cache-Control: no-store)</tspan></text><rect x="22" y="624" width="1196" height="368" rx="2" fill="none" stroke="#5b6b73" stroke-width="1"/><path d="M22,624 h292.8 v18 l-8,8 H22 z" fill="#eef1f2" stroke="#5b6b73" stroke-width="1"/><text font-family="Liberation Sans, Arial, DejaVu Sans, sans-serif" font-size="12" fill="#5b6b73" font-weight="bold" font-style="normal" text-anchor="start" dominant-baseline="middle"><tspan x="28" y="637.0">Đọc: thẩm định viên bấm «Hiện» trên M06</tspan></text></svg>