.0" y="200.0">AAD (không lưu, dựng lại khi giải mã):  02 ‖ &quot;customers.national_id:3f2b0c4e11114222833394445555666&quot;</tspan></text><text font-family="Liberation Sans, Arial, DejaVu Sans, sans-serif" font-size="13" fill="#5b6b73" font-weight="normal" font-style="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="615" y="255.0">Byte 01 = AES-256-GCM (dữ liệu trước ADR 0005, chỉ còn giải mã). Byte 02 = ChaCha20-Poly1305. Byte khác → từ chối.</tspan></text></svg>