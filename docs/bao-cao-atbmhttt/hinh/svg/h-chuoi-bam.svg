ly="DejaVu Sans Mono, JetBrains Mono, monospace" font-size="12" fill="#0f6e5a" font-weight="normal" font-style="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="160" y="150.0">hash = 68c1…</tspan></text><rect x="330" y="50" width="260" height="120" rx="6" fill="#ffffff" stroke="#33424a" stroke-width="1.4"/><text font-family="Liberation Sans, Arial, DejaVu Sans, sans-serif" font-size="13" fill="#1f2a30" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="460" y="70.0">seq 57</tspan></text><text font-family="DejaVu Sans Mono, JetBrains Mono, monospace" font-size="13" fill="#1f2a30" font-weight="normal" font-style="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="460" y="96.0">(hành động gốc)</tspan></text><text font-family="DejaVu Sans Mono, JetBrains Mono, monospace" font-size="12" fill="#5b6b73" font-weight="normal" font-style="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="460" y="124.0">prev = 68c1…</tspan></text><text font-family="DejaVu Sans Mono, JetBrains Mono, monospace" font-size="12" fill="#0f6e5a" font-weight="normal" font-style="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="460" y="150.0">hash = 106a…</tspan></text><rect x="630" y="50" width="260" height="120" rx="6" fill="#ffffff" stroke="#33424a" stroke-width="1.4"/><text font-family="Liberation Sans, Arial, DejaVu Sans, sans-serif" font-size="13" fill="#1f2a30" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="760" y="70.0">seq 58</tspan></text><text font-family="DejaVu Sans Mono, JetBrains Mono, monospace" font-size="13" fill="#1f2a30" font-weight="normal" font-style="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="760" y="96.0">DISBURSE_REQUEST</tspan></text><text font-family="DejaVu Sans Mono, JetBrains Mono, monospace" font-size="12" fill="#5b6b73" font-weight="normal" font-style="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="760" y="124.0">prev = 106a…</tspan></text><text font-family="DejaVu Sans Mono, JetBrains Mono, monospace" font-size="12" fill="#0f6e5a" font-weight="normal" font-style="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="760" y="150.0">hash = 2666…</tspan></text><rect x="930" y="50" width="260" height="120" rx="6" fill="#ffffff" stroke="#33424a" stroke-width="1.4"/><text font-family="Liberation Sans, Arial, DejaVu Sans, sans-serif" font-size="13" fill="#1f2a30" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="1060" y="70.0">seq 59</tspan></text><text font-family="DejaVu Sans Mono, JetBrains Mono, monospace" font-size="13" fill="#1f2a30" font-weight="normal" font-style="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="1060" y="96.0">…</tspan></text><text font-family="DejaVu Sans Mono, JetBrains Mono, monospace" font-size="12" fill="#5b6b73" font-weight="normal" font-style="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="1060" y="124.0">prev = 2666…</tspan></text><text font-family="DejaVu Sans Mono, JetBrains Mono, monospace" font-size="12" fill="#0f6e5a" font-weight="normal" font-style="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="1060" y="150.0">hash = …</tspan></text><line x1="290" y1="145" x2="330" y2="120" stroke="#0f6e5a" stroke-width="1.4" marker-end="url(#head-0f6e5a)"/><line x1="590" y1="145" x2="630" y2="120" stroke="#0f6e5a" stroke-width="1.4" marker-end="url(#head-0f6e5a)"/><line x1="890" y1="145" x2="930" y2="120" stroke="#0f6e5a" stroke-width="1.4" marker-end="url(#head-0f6e5a)"/><rect x="330" y="200" width="260" height="110" rx="6" fill="#fdecea" stroke="#b42318" stroke-width="1.4"/><text font-family="Liberation Sans, Arial, DejaVu Sans, sans-serif" font-size="13" fill="#b42318" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="460" y="220.0">Kẻ có quyền root sửa seq 57</tspan></text><text font-family="DejaVu Sans Mono, JetBrains Mono, monospace" font-size="13" fill="#b42318" font-weight="normal" font-style="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="460" y="248.0">action = LOGIN_FAIL</tspan></text><text font-family="Liberation Sans, Arial, DejaVu Sans, sans-serif" font-size="12" fill="#b42318" font-weight="normal" font-style="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="460" y="276.0">SHA-256 tính lại ≠ hash đã lưu</tspan></text><text font-family="Liberation Sans, Arial, DejaVu Sans, sans-serif" font-size="12" fill="#b42318" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="460" y="298.0">→ kiểm tra báo hỏng tại seq 57</tspan></text><rect x="630" y="200" width="580" height="110" rx="6" fill="#f3f6f5" stroke="#33424a" stroke-width="1.4"/><text font-family="Liberation Sans, Arial, DejaVu Sans, sans-serif" font-size="12" fill="#1f2a30" font-weight="normal" font-style="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="920.0" y="240.0">Tính lại cả hash của 57 thì hash mới ≠ prev của 58 → báo hỏng tại 58.</tspan><tspan x="920.0" y="255.0">Muốn che giấu phải tính lại mọi bản ghi phía sau. Tài khoản ứng dụng</tspan><tspan x="920.0" y="270.0">không có quyền UPDATE/DELETE trên audit_logs.</tspan></text></svg>