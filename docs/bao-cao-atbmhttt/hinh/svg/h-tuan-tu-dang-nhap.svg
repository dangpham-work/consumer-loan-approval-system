r="middle" dominant-baseline="middle"><tspan x="885.0" y="1065.0">FieldCipher</tspan></text><line x1="1150.0" y1="112" x2="1150.0" y2="1046" stroke="#5b6b73" stroke-width="1" stroke-dasharray="6 4"/><rect x="1075.0" y="40" width="150" height="52" rx="6" fill="#fdf3dc" stroke="#8a5a00" stroke-width="1.4"/><text font-family="Liberation Sans, Arial, DejaVu Sans, sans-serif" font-size="13" fill="#1f2a30" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="1150.0" y="66.0">MySQL</tspan></text><rect x="1075.0" y="1050" width="150" height="30" rx="6" fill="#fdf3dc" stroke="#8a5a00" stroke-width="1.4"/><text font-family="Liberation Sans, Arial, DejaVu Sans, sans-serif" font-size="13" fill="#1f2a30" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="1150.0" y="1065.0">MySQL</tspan></text><line x1="90.0" y1="168" x2="351.0" y2="168" stroke="#1f2a30" stroke-width="1.4" marker-end="url(#head-1f2a30)"/><text font-family="Liberation Sans, Arial, DejaVu Sans, sans-serif" font-size="13" fill="#1f2a30" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round"><tspan x="100.0" y="157.0">1. POST /app/login (tên đăng nhập, mật khẩu)</tspan></text><path d="M355.0,196 H389.0 V238 H359.0" fill="none" stroke="#1f2a30" stroke-width="1.4" marker-end="url(#head-1f2a30)"/><text font-family="Liberation Sans, Arial, DejaVu Sans, sans-serif" font-size="13" fill="#1f2a30" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round"><tspan x="397.0" y="217.0">2. Giới hạn 10 lượt/phút/IP (SR12), kiểm tra CSRF</tspan></text><line x1="355.0" y1="278" x2="616.0" y2="278" stroke="#1f2a30" stroke-width="1.4" marker-end="url(#head-1f2a30)"/><text font-family="Liberation Sans, Arial, DejaVu Sans, sans-serif" font-size="13" fill="#1f2a30" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round"><tspan x="365.0" y="267.0">3. login(username, password)</tspan></text><line x1="620.0" y1="322" x2="1146.0" y2="322" stroke="#1f2a30" stroke-width="1.4" marker-end="url(#head-1f2a30)"/><text font-family="Liberation Sans, Arial, DejaVu Sans, sans-serif" font-size="13" fill="#1f2a30" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round"><tspan x="630.0" y="311.0">4. SELECT users WHERE username = ?</tspan></text><path d="M620.0,350 H654.0 V392 H624.0" fill="none" stroke="#1f2a30" stroke-width="1.4" marker-end="url(#head-1f2a30)"/><text font-family="Liberation Sans, Arial, DejaVu Sans, sans-serif" font-size="13" fill="#1f2a30" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round"><tspan x="662.0" y="371.0">5. Argon2id verify (chạy cả khi tài khoản không tồn tại)</tspan></text><line x1="620.0" y1="482" x2="1146.0" y2="482" stroke="#1f2a30" stroke-width="1.4" marker-end="url(#head-1f2a30)"/><text font-family="Liberation Sans, Arial, DejaVu Sans, sans-serif" font-size="13" fill="#1f2a30" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round"><tspan x="630.0" y="454.9">6a. failed_attempts + 1; đủ 5 lần → locked_until = now + 15 phút;</tspan><tspan x="630.0" y="471.1">ghi LOGIN_FAIL</tspan></text><line x1="355.0" y1="526" x2="94.0" y2="526" stroke="#1f2a30" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open-1f2a30)"/><text font-family="Liberation Sans, Arial, DejaVu Sans, sans-serif" font-size="13" fill="#1f2a30" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round"><tspan x="100.0" y="515.0">6b. &quot;Sai tên đăng nhập hoặc mật khẩu&quot; (thông báo chung)</tspan></text><rect x="22" y="404" width="1196" height="142" rx="2" fill="none" stroke="#5b6b73" stroke-width="1"/><path d="M22,404 h134.4 v18 l-8,8 H22 z" fill="#eef1f2" stroke="#5b6b73" stroke-width="1"/><text font-family="Liberation Sans, Arial, DejaVu Sans, sans-serif" font-size="12" fill="#5b6b73" font-weight="bold" font-style="normal" text-anchor="start" dominant-baseline="middle"><tspan x="28" y="417.0">alt  sai mật khẩu</tspan></text><line x1="620.0" y1="586" x2="1146.0" y2="586" stroke="#1f2a30" stroke-width="1.4" marker-end="url(#head-1f2a30)"/><text font-family="Liberation Sans, Arial, DejaVu Sans, sans-serif" font-size="13" fill="#1f2a30" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round"><tspan x="630.0" y="575.0">7. INSERT sessions(token_hash = HMAC-SHA256(SESSION_SECRET, token), stage = MFA)</tspan></text><line x1="355.0" y1="630" x2="94.0" y2="630" stroke="#1f2a30" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open-1f2a30)"/><text font-family="Liberation Sans, Arial, DejaVu Sans, sans-serif" font-size="13" fill="#1f2a30" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round"><tspan x="100.0" y="619.0">8. Set-Cookie: session (HttpOnly, Secure, SameSite=Strict) → /app/login/otp</tspan></text><line x1="90.0" y1="674" x2="351.0" y2="674" stroke="#1f2a30" stroke-width="1.4" marker-end="url(#head-1f2a30)"/><text font-family="Liberation Sans, Arial, DejaVu Sans, sans-serif" font-size="13" fill="#1f2a30" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round"><tspan x="100.0" y="663.0">9. POST /app/login/otp (mã 6 số từ ứng dụng xác thực)</tspan></text><line x1="355.0" y1="718" x2="616.0" y2="718" stroke="#1f2a30" stroke-width="1.4" marker-end="url(#head-1f2a30)"/><text font-family="Liberation Sans, Arial, DejaVu Sans, sans-serif" font-size="13" fill="#1f2a30" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round"><tspan x="365.0" y="707.0">10. verify_login_otp(token, code)</tspan></text><line x1="620.0" y1="762" x2="881.0" y2="762" stroke="#1f2a30" stroke-width="1.4" marker-end="url(#head-1f2a30)"/><text font-family="Liberation Sans, Arial, DejaVu Sans, sans-serif" font-size="13" fill="#1f2a30" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round"><tspan x="630.0" y="751.0">11. decrypt(totp_secret_enc, &quot;users.totp_secret:{id}&quot;)</tspan></text><path d="M885.0,790 H919.0 V832 H889.0" fill="none" stroke="#1f2a30" stroke-width="1.4" marker-end="url(#head-1f2a30)"/><text font-family="Liberation Sans, Arial, DejaVu Sans, sans-serif" font-size="13" fill="#1f2a30" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round"><tspan x="927.0" y="802.9">12. Kiểm tra tag Poly1305</tspan><tspan x="927.0" y="819.1">rồi giải mã ChaCha20</tspan></text><line x1="885.0" y1="872" x2="624.0" y2="872" stroke="#1f2a30" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open-1f2a30)"/><text font-family="Liberation Sans, Arial, DejaVu Sans, sans-serif" font-size="13" fill="#1f2a30" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round"><tspan x="630.0" y="861.0">13. khóa TOTP K (160 bit)</tspan></text><path d="M620.0,900 H654.0 V942 H624.0" fill="none" stroke="#1f2a30" stroke-width="1.4" marker-end="url(#head-1f2a30)"/><text font-family="Liberation Sans, Arial, DejaVu Sans, sans-serif" font-size="13" fill="#1f2a30" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round"><tspan x="662.0" y="912.9">14. HMAC-SHA1(K, ⌊t/30⌋), lệch ±1 bước,</tspan><tspan x="662.0" y="929.1">bước &gt; totp_last_step (chống phát lại)</tspan></text><line x1="620.0" y1="982" x2="1146.0" y2="982" stroke="#1f2a30" stroke-width="1.4" marker-end="url(#head-1f2a30)"/><text font-family="Liberation Sans, Arial, DejaVu Sans, sans-serif" font-size="13" fill="#1f2a30" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round"><tspan x="630.0" y="971.0">15. UPDATE totp_last_step, sessions.stage = FULL; ghi LOGIN_SUCCESS (chuỗi băm)</tspan></text><line x1="355.0" y1="1026" x2="94.0" y2="1026" stroke="#1f2a30" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open-1f2a30)"/><text font-family="Liberation Sans, Arial, DejaVu Sans, sans-serif" font-size="13" fill="#1f2a30" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round"><tspan x="100.0" y="1015.0">16. Chuyển tới trang chủ theo vai trò</tspan></text></svg>