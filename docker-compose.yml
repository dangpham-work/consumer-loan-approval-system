# Mô phỏng biểu đồ triển khai (mục 4.2.3) trên một máy. Mật khẩu lấy từ file .env (không commit).
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?đặt MYSQL_ROOT_PASSWORD trong .env}
    volumes:
      - mysqldata:/var/lib/mysql
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    # Không mở cổng 3306 ra ngoài: chỉ app truy cập qua mạng nội bộ "data".

  app:
    build: .
    environment:
      # Dựng URL từ thành phần để mật khẩu có ký tự đặc biệt không làm hỏng chuỗi kết nối.
      DB_HOST: mysql
      DB_NAME: loan_system
      # Ứng dụng chạy bằng tài khoản quyền tối thiểu; root chỉ dùng cho create_database lúc khởi động.
      DB_USER: loan_app
      DB_PASSWORD: ${DB_PASSWORD:?đặt DB_PASSWORD trong .env}
      DB_ADMIN_USER: root
      DB_ADMIN_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:?}
      DATA_ENC_KEY: ${DATA_ENC_KEY:?}
      HMAC_INTEGRITY_KEY: ${HMAC_INTEGRITY_KEY:?}
      BLIND_INDEX_KEY: ${BLIND_INDEX_KEY:?}
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure
    networks: [data, app]
    ports:
      - "127.0.0.1:8000:8000"  # Nginx/TLS sẽ đứng trước ở ticket sau

networks:
  data:
    internal: true
  app: {}

volumes:
  mysqldata: {}
