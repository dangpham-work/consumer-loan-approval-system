[project]
name = "loan-system"
version = "0.1.0"
description = "Hệ thống quản lý và xét duyệt vay tín dụng tiêu dùng (đồ án OOAD + ATBMHTTT)"
authors = [
    { name = "duyddawngnef", email = "duyddang178@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "fpdf2>=2.8.8",
    "jinja2>=3.1.6",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "pymysql>=1.2.3",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "types-pymysql>=1.2.0.20260923",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
