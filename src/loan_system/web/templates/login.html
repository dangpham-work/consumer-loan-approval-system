{% extends "base.html" %}
{% from "_macros.html" import csrf_field, errors with context %}
{% block title %}Đăng nhập{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Đăng nhập</h1>
  {{ errors(error) }}
  <form method="post" action="/app/login">
    {{ csrf_field() }}
    <label>Tên đăng nhập hoặc số điện thoại
      <input name="username" value="{{ username or '' }}" autocomplete="username" required autofocus>
    </label>
    <label>Mật khẩu
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit">Đăng nhập</button>
  </form>
  <p class="muted">Chưa có tài khoản? <a href="/app/register">Đăng ký</a></p>
</section>
{% endblock %}
